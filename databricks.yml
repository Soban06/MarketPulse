bundle:
  name: marketpulse

variables:
  catalog:
    description: Existing Unity Catalog catalog
    default: workspace

sync:
  include:
    - src/**
    - notebooks/**
  exclude:
    - .env
    - .venv/**
    - data/**
    - output/**
    - tmp/**

resources:
  jobs:
    marketpulse_evidence:
      name: MarketPulse - Phase 3 Evidence
      max_concurrent_runs: 1
      parameters:
        - name: pipeline_run_id
          default: ""
      tasks:
        - task_key: evidence
          notebook_task:
            notebook_path: ./notebooks/93_phase3_evidence.py
            base_parameters:
              catalog: ${var.catalog}
              source_root: ${workspace.file_path}/src
              pipeline_run_id: "{{job.parameters.pipeline_run_id}}"
              optimize: "false"
          timeout_seconds: 3600
    marketpulse_gold_tests:
      name: MarketPulse - Isolated Gold Tests
      max_concurrent_runs: 1
      tasks:
        - task_key: gold_tests
          notebook_task:
            notebook_path: ./notebooks/82_test_gold.py
            base_parameters:
              catalog: ${var.catalog}
              source_root: ${workspace.file_path}/src
              cleanup: "true"
          timeout_seconds: 7200
    marketpulse_pipeline:
      name: MarketPulse - Bronze Silver Gold
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: batch_ids
          default: ""
        - name: from_batch
          default: ""
        - name: to_batch
          default: ""
        - name: start_date
          default: ""
        - name: end_date
          default: ""
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              source_root: ${workspace.file_path}/src
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
        - task_key: pipeline
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/04_run_pipeline.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              source_root: ${workspace.file_path}/src
              pipeline_run_id: "{{job.run_id}}"
              batch_ids: "{{job.parameters.batch_ids}}"
              from_batch: "{{job.parameters.from_batch}}"
              to_batch: "{{job.parameters.to_batch}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 7200

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
